[project]
name = "meaninghash"
version = "0.1.0"
description = "Semantic integrity protocol for detecting intent drift across humans, prompts, AI agents, plans, and generated artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MeaningHash Contributors" }]
keywords = [
  "ai", "llm", "ai-agents", "semantic-analysis", "developer-tools",
  "prompt-engineering", "ai-safety", "nlp", "semantic-diff",
]
dependencies = [
  "pydantic>=2.5",
  "typer>=0.9",
  "rich>=13.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
meaninghash = "meaninghash.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meaninghash"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
